<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@mifor1s</title>
<meta name="description" content="@mifor1s — a regular everyday normal motherfucker.">
<meta name="theme-color" content="#0e1319">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1319;--panel:#151c25;--line:#243040;--tx:#e9eef4;--mut:#93a1b1;--ac:#86b6ff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 17px/1.6 "Golos Text",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.disp{font-family:Unbounded,"Golos Text",sans-serif;letter-spacing:-.02em}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--ac);color:#0b1220;font:700 15px "Golos Text",sans-serif;border:0;cursor:pointer;white-space:nowrap;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1120px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 22px 0}
.logo{font-weight:700;font-size:16px}
.frame{position:relative;width:calc(100% - 44px);max-width:1120px;margin:20px auto 0;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame.paused::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;margin:-18px 0 0 -10px;border-left:30px solid rgba(255,255,255,.92);border-top:18px solid transparent;border-bottom:18px solid transparent;filter:drop-shadow(0 2px 12px rgba(0,0,0,.5))}
.title{max-width:1120px;margin:0 auto;padding:36px 22px 0}
h1{font-size:clamp(44px,12vw,128px);line-height:1;word-break:break-all}
.tag{margin:16px 0 28px;font-size:clamp(18px,3.4vw,26px);max-width:22em;opacity:.92}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.wrap{max-width:1120px;margin:auto;padding:64px 22px 0}
dl{border-top:1px solid var(--line)}
dl div{display:grid;grid-template-columns:.8fr 1.2fr;gap:28px;padding:18px 0;border-bottom:1px solid var(--line)}
dt{color:var(--mut)}
dd a:hover{color:var(--ac)}
.contact{margin-top:64px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(24px,5vw,44px);display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.contact h2{font-size:clamp(22px,3.6vw,30px);line-height:1.15}
.contact p{color:var(--mut);margin-top:6px}
footer{max-width:1120px;margin:64px auto 0;padding:26px 22px 44px;border-top:1px solid var(--line);color:var(--mut);font-size:15px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:720px){dl div{grid-template-columns:1fr;gap:6px}.wrap{padding-top:52px}.contact{margin-top:52px}.frame{border-radius:14px}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="top"><a class="logo disp" href="#top">mifor1s</a><a class="btn ghost" href="https://t.me/mifor1s">Написать</a></div>

<div class="frame paused" id="frame" role="button" tabindex="0" aria-label="Видео: играть или пауза">
<video src="video/banner.mp4" poster="video/poster.jpg" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
</div>

<main id="top">
<div class="title">
<h1 class="disp">@mifor1s</h1>
<p class="tag">a regular everyday normal motherfucker</p>
<div class="cta"><a class="btn" href="https://t.me/mifor1s">Telegram</a></div>
</div>

<section class="wrap">
<dl>
<div><dt>Ник</dt><dd>@mifor1s</dd></div>
<div><dt>Статус</dt><dd>a regular everyday normal motherfucker</dd></div>
<div><dt>Связь</dt><dd><a href="https://t.me/mifor1s">Telegram</a></dd></div>
</dl>

<div class="contact">
<div><h2 class="disp">Есть что обсудить?</h2><p>Пиши в Telegram, отвечу, когда увижу.</p></div>
<div class="cta"><a class="btn" href="https://t.me/mifor1s">Открыть Telegram</a><button class="btn ghost" id="copy" type="button">Скопировать ник</button></div>
</div>
</section>
</main>

<footer><span>© 2026 @mifor1s</span><a href="#top">Наверх</a></footer>

<script>
const f=document.getElementById("frame"),v=f.querySelector("video");
const sync=()=>f.classList.toggle("paused",v.paused);
v.addEventListener("play",sync);v.addEventListener("pause",sync);
const tog=()=>{v.paused?v.play().catch(()=>{}):v.pause()};
f.addEventListener("click",tog);
f.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}});
if(matchMedia("(prefers-reduced-motion:reduce)").matches){v.removeAttribute("autoplay");v.pause()}
else v.play().catch(()=>{});
sync();
const c=document.getElementById("copy");
c.addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText("@mifor1s");c.textContent="Скопировано"}catch(e){c.textContent="@mifor1s"}
  setTimeout(()=>c.textContent="Скопировать ник",1800);
});
</script>
</body>
</html>
